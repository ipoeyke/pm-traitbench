[project]
name = "pm-traitbench"
version = "0.1.0"
description = "Pipeline for generating PM-TraitBench, a synthetic PM behavioural trait dataset"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ipoeyke" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "httpx2>=2.13.1",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
pm-traitbench = "pm_traitbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "network: needs the real network; skipped unless --run-network is passed",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]
