[project]
name = "pm-traitbench"
version = "0.1.0"
description = "Pipeline for generating PM-TraitBench, a synthetic PM behavioural trait dataset"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ipoeyke" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pm-traitbench = "pm_traitbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
