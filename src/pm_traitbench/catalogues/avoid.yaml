biases:
  loss_aversion_lambda: do not describe averaging into a losing position, holding one to avoid taking the loss, or pushing to get back to even after a loss
  disposition_ratio: do not describe taking profit on a winner well short of target while sitting on a losing position
  anchoring_rho: do not describe taking profit at a round number short of your target
  extrapolation_theta: do not describe adding to or entering a trade because a recent trend kept extending
  herding_weight: do not describe taking a position because the street or other desks are already positioned that way
  overconfidence_coverage: do not describe keeping a narrow range of outcomes around your targets, or sizing up because you trust your read
  conviction_size_miscalibration: do not describe sizing a position out of step with how confident you say you are in it
  exit_deficiency: do not describe noticing a trigger and not acting on it, adding to a position past its trigger, or rolling a position later than planned

preferences:
  response_format: do not ask the advisor for a particular answer format
  pushback_style: do not ask the advisor to push back more or less on your view
  register: do not ask the advisor to change its tone
  number_language: do not ask the advisor to quote moves in a particular unit
  answer_ordering: do not ask the advisor to lead with the conclusion or with the reasoning
  hedging_language: do not ask the advisor to hedge its language or give a confidence level
  length_on_routine_questions: do not ask the advisor to keep answers short or go longer on routine questions
  positioning_context: do not ask the advisor for street positioning
  carry_display: do not ask the advisor how it shows carry
  macro_commentary: do not ask the advisor for macro commentary
  calendar_citation: do not ask the advisor to cite calendar events
  source_attribution: do not ask the advisor to name its data source
  scenario_framing: do not ask the advisor to frame outcomes into named scenarios
  peer_comparison: do not ask the advisor to compare your positioning to consensus or to a peer set
  rating_agency_view: do not ask the advisor for the rating agency view
  inventory_data_mention: do not ask the advisor to cite inventory data
  pre_mortem_before_sizing: do not ask the advisor for a pre-mortem before sizing
  weekly_exposure_recap: do not ask the advisor for an exposure recap
  end_of_day_summary: do not ask the advisor for a summary when you wrap up for the day
  thesis_reminder_on_review: do not ask the advisor to restate your original thesis
  decision_journal_prompt: do not ask the advisor to prompt you for a journal entry
  earnings_week_heads_up: do not ask the advisor to flag upcoming earnings
  refi_window_reminder: do not ask the advisor to flag a refinancing window
  roll_reminder: do not ask the advisor to flag a contract roll date
  rebalance_recap: do not ask the advisor to recap a rebalance
  hedge_instrument: do not state a standing rule or general preference for which instrument to hedge with
  duration_expression: do not state a standing rule or general preference for expressing rates views as curve trades, butterflies or outright duration
  futures_vs_etf: do not state a standing rule or general preference for trading through futures, an etf or the underlying instrument
  curve_trade_expression: do not state a standing rule or general preference for expressing curve views as calendar spreads, spread ratios or butterflies
  pair_vs_outright: do not state a standing rule or general preference for expressing views as pair trades, outright positions or baskets
  fx_hedge_expression: do not state a standing rule or general preference for hedging fx exposure with forwards, options or futures
  credit_index_vs_single_name: do not state a standing rule or general preference for trading credit through an index, single-name bonds or credit default swaps

# Stance param -> forbidden params whose avoid line the stance's own behaviour can trip.
# A session with a stance on the key leaves these lines out of its forbidden list.
overlaps:
  loss_aversion_lambda: [exit_deficiency]
  disposition_ratio: [loss_aversion_lambda, anchoring_rho]
  anchoring_rho: [disposition_ratio]
  herding_weight: [conviction_size_miscalibration, positioning_context, peer_comparison]
  overconfidence_coverage: [conviction_size_miscalibration]
  conviction_size_miscalibration: [overconfidence_coverage]
  exit_deficiency: [loss_aversion_lambda]
  response_format: [length_on_routine_questions]
  length_on_routine_questions: [response_format]
  answer_ordering: [response_format]
  register: [hedging_language]
  hedging_language: [register]
  positioning_context: [peer_comparison]
  peer_comparison: [positioning_context]
  source_attribution: [calendar_citation, inventory_data_mention]
  calendar_citation: [source_attribution, earnings_week_heads_up, refi_window_reminder, roll_reminder]
  earnings_week_heads_up: [calendar_citation]
  refi_window_reminder: [calendar_citation]
  roll_reminder: [calendar_citation]
  pre_mortem_before_sizing: [scenario_framing, overconfidence_coverage]
  weekly_exposure_recap: [end_of_day_summary, rebalance_recap]
  end_of_day_summary: [weekly_exposure_recap]
  rebalance_recap: [weekly_exposure_recap]
  hedge_instrument: [futures_vs_etf, fx_hedge_expression]
  futures_vs_etf: [hedge_instrument]
  fx_hedge_expression: [hedge_instrument, futures_vs_etf]
  pair_vs_outright: [hedge_instrument]
