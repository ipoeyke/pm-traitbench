definitions:
  loss_aversion_lambda: adds to or holds a losing position because the loss hurts more than an equal gain, pushing to get back to even rather than cutting as the rules say
  disposition_ratio: realises gains well short of target while sitting on losing positions, so winners are sold sooner than losers across the book; holding one loser, or one early exit at a round level, is not this on its own
  anchoring_rho: sets exits and valuations around a reference number such as the entry price, a target or a round level rather than the current view
  extrapolation_theta: enters after a move has already run, expecting the recent trend to continue
  herding_weight: follows the street view or crowd positioning over their own signal when the two disagree
  overconfidence_coverage: states ranges that are too narrow and sizes positions as if more certain than the evidence supports
  conviction_size_miscalibration: position sizes do not track the conviction stated for the idea
  exit_deficiency: does not act when their own stop, target or signpost fires, or acts late
