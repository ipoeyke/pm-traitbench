preferences:
  - param: response_format
    group: communication
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "three lines max, number first"
      - "short bullets"
      - "full prose"
  - param: challenge_tolerance
    group: communication
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "push back if the data disagrees"
      - "flag mixed signals only"
      - "present findings without pushback"
  - param: data_recency
    group: information
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "prioritize the last five sessions"
      - "weight the full quarter equally"
      - "flag any data older than a week"
  - param: source_preference
    group: information
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "sell-side research first"
      - "primary filings first"
      - "channel checks first"
  - param: review_cadence
    group: workflow
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "daily book review"
      - "weekly book review"
      - "review only on triggers"
  - param: sizing_workflow
    group: workflow
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "size in one step"
      - "scale in over three tranches"
      - "size after a confirmation signal"
  - param: idea_write_up_length
    group: expression
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "one paragraph max"
      - "half page with a chart"
      - "full memo with appendix"
  - param: conviction_language
    group: expression
    asset_classes: [equities, rates_credit, commodities, multi_asset]
    values:
      - "state a target price"
      - "state a direction only"
      - "state a range with a midpoint"
  - param: curve_positioning_language
    group: expression
    asset_classes: [rates_credit]
    values:
      - "describe as basis points of DV01"
      - "describe as a curve trade label"
      - "describe as an outright duration view"
